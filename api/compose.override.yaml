
services:
###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432"
###< doctrine/doctrine-bundle ###

  # Throwaway PostgreSQL for the test suite (see .env.test).
  # Data lives in memory: it is lost when the container stops, and the
  # integration tests rebuild the schema from the migrations on their first run.
  database_test:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: app_test
      POSTGRES_PASSWORD: test
      POSTGRES_USER: test
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "app_test", "-U", "test"]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      # Fixed and bound to localhost only; 5432 and 5433 are often taken by other projects.
      - "127.0.0.1:54320:5432"
    tmpfs:
      - /var/lib/postgresql/data
