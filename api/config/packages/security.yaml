security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Ecommerce\Infrastructure\Persistence\Entity\User\DoctrineUser
                property: email

    # Mirrors App\Ecommerce\Domain\Model\User\Role: each role includes the previous one.
    role_hierarchy:
        ROLE_EDITOR: ROLE_USER
        ROLE_ADMIN: ROLE_EDITOR

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        login:
            # No token is expected on the sign-in and sign-out routes: an expired one must not block them.
            pattern: ^/api/v1/((shop|admin)/login|token/revoke)$
            stateless: true
            security: false
        main:
            lazy: true
            provider: app_user_provider
            stateless: true
            jwt: ~
            refresh_jwt:
                check_path: api_token_refresh
                failure_handler: App\Ecommerce\Infrastructure\Security\RefreshTokenFailureHandler
            # Two authenticators: a request without credentials is answered by the JWT one (401).
            entry_point: jwt

    # Two spaces, one rule each (CLAUDE.md, "Architecture cible"):
    #   /api/v1/shop/*   the shop: public for the catalogue and authentication, ROLE_USER otherwise
    #   /api/v1/admin/*  the back-office: ROLE_ADMIN, or ROLE_EDITOR for the catalogue
    # Only the *first* matching rule is applied, so the order matters.
    # Anything outside these two spaces falls into the last rule and is admin-only:
    # a new route is closed until it is explicitly opened.
    access_control:
        # The OpenAPI contract and its Swagger UI are public: they describe the API, they do not open it
        - { path: ^/api/v1/doc(\.json)?$, methods: [GET], roles: PUBLIC_ACCESS }

        # Token renewal and sign-out, shared by both fronts: the refresh token is the credential
        - { path: ^/api/v1/token/(refresh|revoke)$, methods: [POST], roles: PUBLIC_ACCESS }

        # Shop, public: authentication and catalogue reading
        - { path: ^/api/v1/shop/(login|register)$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/shop/products(/[^/]+)?$, methods: [GET], roles: PUBLIC_ACCESS }

        # Shop, signed-in customer. /me always targets the account of the token: no id to check.
        - { path: ^/api/v1/shop/, roles: ROLE_USER }

        # Back-office. Its sign-in route is public (see the "login" firewall).
        # Editors manage the catalogue and read their own identity; everything else needs an administrator.
        - { path: ^/api/v1/admin/products(/|$), roles: ROLE_EDITOR }
        - { path: ^/api/v1/admin/categories(/|$), roles: ROLE_EDITOR }
        - { path: ^/api/v1/admin/me$, roles: ROLE_EDITOR }
        - { path: ^/api/v1/admin/, roles: ROLE_ADMIN }

        # Everything else
        - { path: ^/, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
