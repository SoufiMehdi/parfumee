security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Ecommerce\Infrastructure\Persistence\Entity\User\DoctrineUser
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        login:
            pattern: ^/users/login$
            stateless: true
            security: false
        main:
            lazy: true
            provider: app_user_provider
            stateless: true
            jwt: ~

    # Only the *first* matching rule is applied, so the order matters.
    # Any route that is not listed here falls into the last rule and is
    # admin-only: a new route is closed until it is explicitly opened.
    access_control:
        # Public: authentication and catalogue reading
        - { path: ^/users/(login|create)$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/products(/filter)?$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/product/[^/]+$, methods: [GET], roles: PUBLIC_ACCESS }

        # Back-office: must stay above the customer account rule, which would match /users/list
        - { path: ^/users/list$, roles: ROLE_ADMIN }

        # Customer account: ownership is then enforced by UserAccountVoter
        - { path: ^/users/[^/]+$, methods: [GET, PUT, DELETE], roles: ROLE_USER }

        # Everything else (catalogue writes, uploads, future routes)
        - { path: ^/, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
